<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffb703; /* Construction yellow accent */
        }

        p {
            font-size: 1.1rem;
            color: #a0a0a0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Progress Bar */
        .progress-container {
            background-color: #333;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #ffb703, #fb8500);
            height: 100%;
            width: 70%; /* Adjust this to change the progress percentage */
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        .footer {
            font-size: 0.9rem;
            color: #666;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚧</div>
        <h1>Under Construction</h1>
        <p>We are currently working hard behind the scenes to bring you a brand-new digital experience. Something awesome is in the works, so stay tuned!</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="footer">
            &copy; 2026 Your Company Name. All rights reserved.
        </div>
    </div>

</body>
</html>
